# ============================================
# Selenium Automation Framework Configuration
# ============================================

# Browser Configuration
browser=chrome
headless=true

# Application URL
base.url=https://www.google.com

# Wait Configuration (in seconds)
implicit.wait=10
explicit.wait=15
page.load.timeout=30

# Screenshot Configuration
screenshot.on.failure=true
screenshot.dir=reports/screenshots/

# Report Configuration
report.dir=reports/
report.title=Automation Test Report
